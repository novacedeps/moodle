services:
  mysql:
    image: mysql:8.0.36
    container_name: moodle-db
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodle
      MYSQL_PASSWORD: moodle
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - moodle-net

  redis:
    image: redis:7
    container_name: moodle-redis
    restart: always
    networks:
      - moodle-net

  moodle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moodle-app
    volumes:
      - ./moodle:/app
      - moodledata:/var/moodledata
    depends_on:
      - mysql
      - redis
    networks:
      - moodle-net

  nginx:
    image: nginx:stable
    container_name: moodle-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./moodle:/app:ro
    depends_on:
      - moodle
    networks:
      - moodle-net

volumes:
  mysql_data:
  moodledata:

networks:
  moodle-net:
    driver: bridge